name: Build debug APK

# Собирает debug APK в облаке GitHub — не нужен ни Android Studio, ни компьютер.
# Готовый файл появляется во вкладке Actions → (последний запуск) → Artifacts.
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        # На раннере GitHub Android SDK уже предустановлен (включая platform 37
        # и нужные build-tools) — предыдущая версия шага пыталась поставить его
        # заново через отдельный android-actions/setup-android, и именно это
        # не смогло найти "platforms;android-37" в своём собственном, более
        # старом списке пакетов. Проще и надёжнее принять лицензии для уже
        # готового SDK и не трогать его установку вовсе.
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # "current" — всегда свежий стабильный Gradle. AGP 9.3 требует Gradle 9.5.0+,
          # а в проекте нет закоммиченного gradle wrapper, поэтому ставим Gradle явно здесь.
          gradle-version: current

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-consilium-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
